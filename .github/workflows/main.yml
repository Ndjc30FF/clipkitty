name: Clips Studio (Gemma 7B Headless Web)

on:
  workflow_dispatch:

concurrency:
  group: clips-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-gemma-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ColinGPT9/clips-studio

      - name: Cache Ollama Models (Gemma 7B)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-gemma-7b-v1

      - name: Install & Configure Host Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Force Ollama to accept connections from Docker containers
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_MAX_LOADED_MODELS=2
          export OLLAMA_NUM_PARALLEL=2
          
          # Start Ollama daemon in background
          ollama serve &
          
          # Wait for Ollama service port to open
          echo "Waiting for Ollama service to start..."
          until curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 1
          done
          echo "Ollama service is live."
          
          # Pull Gemma 7B (Skips download if cache hit)
          echo "Verifying / Loading Gemma 7B model..."
          ollama pull gemma:7b

      - name: Establish Tailscale Mesh Tunnel
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          
          # Start Tailscale daemon in memory mode
          sudo tailscaled --state=mem: &
          
          # Wait for daemon socket initialization
          sleep 3
          
          # Connect to private network using GitHub Secret
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="clips-gemma-$GITHUB_RUN_ID"
          
          # Extract assigned private IP
          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP acquisition failed."
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale connected at IP: $TS_IP"

      - name: Launch Clips Studio Web Stack (Bypassing Internal Ollama)
        run: |
          # Retrieve default Docker gateway IP (usually 172.17.0.1)
          DOCKER_GATEWAY=$(ip route show dev docker0 | awk '{print $7}')
          if [ -z "$DOCKER_GATEWAY" ]; then
            DOCKER_GATEWAY="172.17.0.1"
          fi
          
          echo "Mapping OLLAMA_HOST to Docker Gateway: http://$DOCKER_GATEWAY:11434"
          export OLLAMA_HOST="http://$DOCKER_GATEWAY:11434"
          
          # Launch only UI and Backend, scaling repo's internal ollama container to 0 to avoid port conflict
          docker compose up -d --scale ollama=0 || docker compose up -d ui backend

      - name: Display Web URL & Session Loop
        run: |
          echo ""
          echo "=================================================="
          echo "        CLIPS STUDIO IS LIVE & READY              "
          echo "=================================================="
          echo " Web Interface:  http://$TAILSCALE_IP:5173        "
          echo " Tailscale IP:   $TAILSCALE_IP                    "
          echo " Active Model:   gemma:7b (Hosted on Runner)      "
          echo "=================================================="
          echo ""
          
          # Health check & session keep-alive loop
          while true; do
            echo "[$(date)] Web App & Gemma 7B Active. Access at http://$TAILSCALE_IP:5173"
            sleep 300
          done
