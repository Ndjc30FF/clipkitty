name: Clips Studio (Gemma 7B Headless Web)

on:
  workflow_dispatch:

concurrency:
  group: clips-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-gemma-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          repository: ColinGPT9/clips-studio

      - name: Cache Ollama Models (Gemma 7B)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-gemma-7b-v1

      - name: Install & Configure Host Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_MAX_LOADED_MODELS=2
          export OLLAMA_NUM_PARALLEL=2
          
          ollama serve &
          
          echo "Waiting for Ollama service to start..."
          until curl -s http://localhost:11434/api/tags > /dev/null; do
            sleep 1
          done
          echo "Ollama service is live."
          
          echo "Verifying / Loading Gemma 7B model..."
          ollama pull gemma:7b

      - name: Establish Tailscale Mesh Tunnel
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscaled --state=mem: &
          sleep 3
          
          sudo tailscale up --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" --hostname="clips-gemma-$GITHUB_RUN_ID"
          
          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Error: Tailscale IP acquisition failed."
            exit 1
          fi
          
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          echo "Tailscale connected at IP: $TS_IP"

      - name: Launch Clips Studio Web Stack & Expose Ports
        run: |
          DOCKER_GATEWAY=$(ip route show dev docker0 | awk '{print $7}')
          if [ -z "$DOCKER_GATEWAY" ]; then
            DOCKER_GATEWAY="172.17.0.1"
          fi
          
          export OLLAMA_HOST="http://$DOCKER_GATEWAY:11434"
          
          # Spin up containers ignoring internal ollama
          docker compose up -d --scale ollama=0 || docker compose up -d ui backend
          
          # Wait 10 seconds for Vite/React server to bind
          sleep 10
          
          # Verify local connectivity on the runner
          echo "Testing local HTTP response..."
          curl -I http://localhost:5173 || echo "WARNING: Port 5173 not responding on localhost!"

      - name: Display Web URL & Session Loop
        run: |
          echo ""
          echo "=================================================="
          echo "        CLIPS STUDIO IS LIVE & READY              "
          echo "=================================================="
          echo " Web Interface:  http://$TAILSCALE_IP:5173        "
          echo " Tailscale IP:   $TAILSCALE_IP                    "
          echo " Active Model:   gemma:7b (Hosted on Runner)      "
          echo "=================================================="
          echo ""
          
          while true; do
            echo "[$(date)] Web App Active. Access at http://$TAILSCALE_IP:5173"
            sleep 300
          done
