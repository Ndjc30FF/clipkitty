name: Clips Studio - Cloud Runner

on:
  workflow_dispatch:

concurrency:
  group: clips-studio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clips-studio:
    name: Run Clips Studio
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout Clips Studio
        uses: actions/checkout@v4
        with:
          repository: ColinGPT9/clips-studio
          ref: main
          fetch-depth: 1

      # ============================================================
      # 2. BASIC SYSTEM INFORMATION
      # ============================================================

      - name: Show Runner Information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "CLIPS STUDIO CLOUD RUNNER"
          echo "======================================================"

          echo ""
          echo "Working directory:"
          pwd

          echo ""
          echo "Repository:"
          git remote -v || true

          echo ""
          echo "Commit:"
          git rev-parse HEAD

          echo ""
          echo "OS:"
          uname -a

          echo ""
          echo "CPU:"
          nproc
          lscpu | grep -E 'Model name|CPU\(s\)' || true

          echo ""
          echo "Memory:"
          free -h

          echo ""
          echo "Disk:"
          df -h

      # ============================================================
      # 3. VERIFY REPOSITORY ARCHITECTURE
      # ============================================================

      - name: Verify Repository Files
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "VERIFYING REPOSITORY"
          echo "======================================================"

          required_files=(
            "docker-compose.yml"
            "README.md"
            "config/settings.yaml"
            "requirements.txt"
            "main.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo ""
              echo "❌ REQUIRED FILE MISSING: $file"
              echo ""
              echo "Repository root:"
              find . -maxdepth 2 -type f | sort | head -200
              exit 1
            fi

            echo "✅ Found: $file"
          done

          echo ""
          echo "======================================================"
          echo "ACTUAL COMPOSE SERVICES"
          echo "======================================================"

          grep -E '^[[:space:]]{2}[a-zA-Z0-9_-]+:' docker-compose.yml || true

          echo ""
          echo "Compose file:"
          sed -n '1,240p' docker-compose.yml

      # ============================================================
      # 4. INSTALL / VERIFY DOCKER
      # ============================================================

      - name: Verify Docker
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "DOCKER"
          echo "======================================================"

          docker --version
          docker compose version

          echo ""
          echo "Docker info:"
          docker info

      # ============================================================
      # 5. VALIDATE THE REPOSITORY'S ORIGINAL COMPOSE FILE
      #
      # IMPORTANT:
      # Do NOT create a custom compose override.
      # Do NOT create backend.
      # Do NOT rename engine -> backend.
      # ============================================================

      - name: Validate Original Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "VALIDATING ORIGINAL DOCKER COMPOSE"
          echo "======================================================"

          echo ""
          echo "Services:"
          docker compose config --services

          echo ""
          echo "Checking expected services..."

          services="$(docker compose config --services)"

          for service in engine ui ollama; do
            if ! grep -qx "$service" <<< "$services"; then
              echo "❌ Expected service '$service' was not found."
              echo ""
              echo "Actual services:"
              echo "$services"
              exit 1
            fi

            echo "✅ $service"
          done

          echo ""
          echo "Checking that every service has image or build..."

          docker compose config > /tmp/clips-compose-config.yml

          python3 - <<'PY'
          import yaml

          with open("/tmp/clips-compose-config.yml", "r", encoding="utf-8") as f:
              data = yaml.safe_load(f)

          services = data.get("services", {})

          if not services:
              raise SystemExit("❌ No services found")

          for name, service in services.items():
              image = service.get("image")
              build = service.get("build")

              print(f"{name}: image={bool(image)}, build={bool(build)}")

              if not image and not build:
                  raise SystemExit(
                      f"❌ Service '{name}' has neither image nor build"
                  )

          print("✅ Every service has image and/or build")
          PY

          echo ""
          echo "======================================================"
          echo "FULL RESOLVED COMPOSE CONFIG"
          echo "======================================================"

          cat /tmp/clips-compose-config.yml

      # ============================================================
      # 6. PULL PREBUILT IMAGES
      #
      # The repository explicitly provides a prebuilt engine image.
      # ============================================================

      - name: Pull Docker Images
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "PULLING CLIPS STUDIO IMAGES"
          echo "======================================================"

          docker compose pull


      # ============================================================
      # 7. START THE ORIGINAL STACK
      # ============================================================

      - name: Start Clips Studio
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "STARTING CLIPS STUDIO"
          echo "======================================================"

          docker compose up -d --build
          echo ""
          echo "Compose startup completed."

      # ============================================================
      # 8. SHOW CONTAINER STATUS
      # ============================================================

      - name: Check Container Status
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "CONTAINER STATUS"
          echo "======================================================"

          docker compose ps -a

          echo ""
          echo "All Docker containers:"
          docker ps -a

          echo ""
          echo "Docker volumes:"
          docker volume ls

      # ============================================================
      # 9. WAIT FOR OLLAMA
      # ============================================================

      - name: Wait For Ollama
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "WAITING FOR OLLAMA"
          echo "======================================================"

          for i in {1..60}; do
            if docker compose exec -T ollama \
              ollama list >/tmp/ollama-list.txt 2>/tmp/ollama-error.txt; then

              echo "✅ Ollama container is ready."
              cat /tmp/ollama-list.txt || true
              break
            fi

            echo "Waiting for Ollama... $i/60"
            sleep 2

            if [[ "$i" == "60" ]]; then
              echo ""
              echo "❌ Ollama did not become ready."
              cat /tmp/ollama-error.txt || true
              docker compose logs --tail=200 ollama || true
              exit 1
            fi
          done

      # ============================================================
      # 10. PULL GEMMA 7B
      #
      # IMPORTANT:
      # Use the repository's actual model tag.
      # ============================================================

      - name: Install Gemma 7B In Ollama
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "INSTALLING GEMMA 7B"
          echo "======================================================"

          echo ""
          echo "Current Ollama models:"
          docker compose exec -T ollama ollama list || true

          echo ""
          echo "Pulling gemma:7b..."

          docker compose exec -T ollama ollama pull gemma:7b

          echo ""
          echo "Models after pull:"
          docker compose exec -T ollama ollama list

      # ============================================================
      # 11. VERIFY GEMMA 7B
      # ============================================================

      - name: Verify Gemma 7B
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "VERIFYING GEMMA 7B"
          echo "======================================================"

          models="$(docker compose exec -T ollama ollama list)"

          echo "$models"

          if ! grep -q "gemma:7b" <<< "$models"; then
            echo ""
            echo "❌ gemma:7b is not installed."
            exit 1
          fi

          echo ""
          echo "✅ gemma:7b is installed."

          echo ""
          echo "Testing Ollama model execution..."

          docker compose exec -T ollama \
            ollama run gemma:7b "Reply with exactly: CLIPS_STUDIO_GEMMA_OK"

      # ============================================================
      # 12. WAIT FOR ENGINE
      # ============================================================

      - name: Wait For Engine API
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "WAITING FOR ENGINE API"
          echo "======================================================"

          for i in {1..90}; do
            if curl -fsS \
              --connect-timeout 3 \
              --max-time 5 \
              http://127.0.0.1:8765/health \
              >/tmp/engine-health.json 2>/tmp/engine-error.txt; then

              echo "✅ Engine responded."
              cat /tmp/engine-health.json
              break
            fi

            echo "Waiting for engine... $i/90"
            sleep 2

            if [[ "$i" == "90" ]]; then
              echo ""
              echo "❌ Engine did not become ready."

              echo ""
              echo "--- ENGINE LOGS ---"
              docker compose logs --tail=300 engine || true

              echo ""
              echo "--- ENGINE ERROR ---"
              cat /tmp/engine-error.txt || true

              exit 1
            fi
          done

      # ============================================================
      # 13. VERIFY ENGINE SYSTEM STATUS
      # ============================================================

      - name: Verify Engine System
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "ENGINE SYSTEM CHECK"
          echo "======================================================"

          echo ""
          echo "GET /health:"
          curl -fsS http://127.0.0.1:8765/health || true

          echo ""
          echo "GET /system/check:"
          curl -fsS http://127.0.0.1:8765/system/check || true

          echo ""
          echo "GET /system/stats:"
          curl -fsS http://127.0.0.1:8765/system/stats || true

          echo ""
          echo "GET /models:"
          curl -fsS http://127.0.0.1:8765/models || true

      # ============================================================
      # 14. WAIT FOR UI
      # ============================================================

      - name: Wait For Web UI
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "WAITING FOR WEB UI"
          echo "======================================================"

          for i in {1..90}; do
            if curl -fsS \
              --connect-timeout 3 \
              --max-time 5 \
              http://127.0.0.1:5173 \
              >/tmp/ui.html 2>/tmp/ui-error.txt; then

              echo "✅ Web UI responded."

              head -c 500 /tmp/ui.html || true

              break
            fi

            echo "Waiting for UI... $i/90"
            sleep 2

            if [[ "$i" == "90" ]]; then
              echo ""
              echo "❌ UI did not become ready."

              echo ""
              echo "--- UI LOGS ---"
              docker compose logs --tail=300 ui || true

              echo ""
              echo "--- UI ERROR ---"
              cat /tmp/ui-error.txt || true

              exit 1
            fi
          done

      # ============================================================
      # 15. VERIFY PORTS
      # ============================================================

      - name: Verify Local Ports
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "PORT VERIFICATION"
          echo "======================================================"

          echo ""
          echo "--- Docker Compose Ports ---"
          docker compose ps

          echo ""
          echo "--- Listening TCP Ports ---"
          sudo ss -lntp || true

          echo ""
          echo "--- UI ---"
          curl -I http://127.0.0.1:5173 || true

          echo ""
          echo "--- ENGINE ---"
          curl -I http://127.0.0.1:8765 || true

          echo ""
          echo "--- OLLAMA ---"
          curl -fsS http://127.0.0.1:11434/api/tags || true

      # ============================================================
      # 16. CHECK ENGINE -> OLLAMA NETWORK
      # ============================================================

      - name: Verify Engine To Ollama Connectivity
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "ENGINE -> OLLAMA NETWORK TEST"
          echo "======================================================"

          docker compose exec -T engine \
            python - <<'PY'
          import os
          import urllib.request

          urls = [
              os.environ.get(
                  "CLIPS_STUDIO_OLLAMA_HOST",
                  "http://ollama:11434"
              ) + "/api/tags"
          ]

          for url in urls:
              print("Testing:", url)
              with urllib.request.urlopen(url, timeout=15) as response:
                  body = response.read().decode("utf-8")
                  print("HTTP:", response.status)
                  print(body[:2000])
          PY

          echo ""
          echo "✅ Engine can reach Ollama."

      # ============================================================
      # 17. DISPLAY FINAL STATUS
      # ============================================================

      - name: Display Final Status
        shell: bash
        run: |
          set -Eeuo pipefail

          echo ""
          echo "======================================================"
          echo "          CLIPS STUDIO IS RUNNING"
          echo "======================================================"

          echo ""
          echo "Runner hostname:"
          hostname

          echo ""
          echo "Docker services:"
          docker compose ps

          echo ""
          echo "Local endpoints:"
          echo "UI:     http://127.0.0.1:5173"
          echo "Engine: http://127.0.0.1:8765"
          echo "Ollama: http://127.0.0.1:11434"

          echo ""
          echo "IMPORTANT:"
          echo "The repository intentionally binds the API/UI to localhost."
          echo "Do not expose the unauthenticated engine API directly."
          echo ""

      # ============================================================
      # 18. KEEP RUNNING
      # ============================================================

      - name: Keep Clips Studio Running
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "KEEPING CLIPS STUDIO ALIVE"
          echo "======================================================"

          while true; do
            echo ""
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Clips Studio status:"
            docker compose ps
            sleep 300
          done

      # ============================================================
      # 19. FAILURE DIAGNOSTICS
      # ============================================================

      - name: Failure Diagnostics
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "======================================================"
          echo "        CLIPS STUDIO FAILURE DIAGNOSTICS"
          echo "======================================================"

          echo ""
          echo "========== GIT =========="
          git rev-parse HEAD 2>&1 || true
          git status 2>&1 || true

          echo ""
          echo "========== FILES =========="
          ls -la 2>&1 || true

          echo ""
          echo "========== DOCKER VERSION =========="
          docker --version 2>&1 || true
          docker compose version 2>&1 || true

          echo ""
          echo "========== DOCKER PS =========="
          docker ps -a 2>&1 || true

          echo ""
          echo "========== COMPOSE SERVICES =========="
          docker compose config --services 2>&1 || true

          echo ""
          echo "========== COMPOSE CONFIG =========="
          docker compose config 2>&1 || true

          echo ""
          echo "========== COMPOSE PS =========="
          docker compose ps -a 2>&1 || true

          echo ""
          echo "========== ENGINE LOGS =========="
          docker compose logs --tail=300 engine 2>&1 || true

          echo ""
          echo "========== UI LOGS =========="
          docker compose logs --tail=300 ui 2>&1 || true

          echo ""
          echo "========== OLLAMA LOGS =========="
          docker compose logs --tail=300 ollama 2>&1 || true

          echo ""
          echo "========== OLLAMA MODELS =========="
          docker compose exec -T ollama ollama list 2>&1 || true

          echo ""
          echo "========== ENGINE HEALTH =========="
          curl -v \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:8765/health \
            2>&1 || true

          echo ""
          echo "========== UI =========="
          curl -v \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:5173 \
            2>&1 || true

          echo ""
          echo "========== OLLAMA =========="
          curl -v \
            --connect-timeout 5 \
            --max-time 10 \
            http://127.0.0.1:11434/api/tags \
            2>&1 || true

          echo ""
          echo "========== PORTS =========="
          sudo ss -lntp 2>&1 || true

          echo ""
          echo "========== MEMORY =========="
          free -h 2>&1 || true

          echo ""
          echo "========== DISK =========="
          df -h 2>&1 || true

          echo ""
          echo "========== DOCKER VOLUMES =========="
          docker volume ls 2>&1 || true

          echo ""
          echo "======================================================"
          echo "END OF FAILURE DIAGNOSTICS"
          echo "======================================================"

      # ============================================================
      # 20. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          echo "======================================================"
          echo "CLEANUP"
          echo "======================================================"

          docker compose down 2>&1 || true

          echo "Docker containers stopped."
