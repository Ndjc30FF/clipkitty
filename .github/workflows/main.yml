name: Clips Studio (Gemma 7B via Tailscale)

on:
  workflow_dispatch:

concurrency:
  group: clips-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-gemma-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================
      - name: Checkout Clips Studio Repository
        uses: actions/checkout@v4
        with:
          repository: ColinGPT9/clips-studio

      # ============================================================
      # 2. VERIFY REPOSITORY & SECRETS
      # ============================================================
      - name: Verify Environment & Secrets
        run: |
          echo "=========================================="
          echo "Checking Repository Directory Contents"
          echo "=========================================="
          ls -la
          
          if [ ! -f "docker-compose.yml" ]; then
            echo "❌ ERROR: docker-compose.yml not found in repository root!"
            exit 1
          fi
          
          if [ -z "${{ secrets.TAILSCALE_AUTH_KEY }}" ]; then
            echo "❌ ERROR: TAILSCALE_AUTH_KEY secret is not set!"
            echo "Add it in: Settings → Secrets and variables → Actions"
            exit 1
          else
            echo "✅ Repository files verified & Tailscale key configured"
          fi

      # ============================================================
      # 3. CACHE OLLAMA MODELS
      # ============================================================
      - name: Cache Ollama Models (Gemma 7B)
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama
          key: ollama-gemma-7b-v1

      # ============================================================
      # 4. INSTALL & CONFIGURE OLLAMA
      # ============================================================
      - name: Install & Configure Host Ollama
        run: |
          echo "=========================================="
          echo "Installing Ollama..."
          echo "=========================================="
          
          curl -fsSL https://ollama.com/install.sh | sh
          
          echo ""
          echo "Configuring Ollama environment..."
          export OLLAMA_HOST="0.0.0.0:11434"
          export OLLAMA_MAX_LOADED_MODELS=2
          export OLLAMA_NUM_PARALLEL=2
          
          echo "Starting Ollama service..."
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 3
          
          echo "Waiting for Ollama API..."
          for i in {1..30}; do
            if curl -s http://localhost:11434/api/tags > /dev/null 2>&1; then
              echo "✅ Ollama is ready"
              break
            fi
            echo "   Attempt $i/30..."
            sleep 1
          done
          
          echo ""
          echo "Pulling Gemma 7B model..."
          ollama pull gemma:7b
          
          echo ""
          echo "Verifying model..."
          curl -s http://localhost:11434/api/tags | grep -q "gemma" && echo "✅ Gemma 7B loaded" || echo "⚠️ Gemma 7B load warning"

      # ============================================================
      # 5. CONNECT TO TAILSCALE
      # ============================================================
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: clips-studio-runner-${{ github.run_id }}

      # ============================================================
      # 6. VERIFY TAILSCALE CONNECTION
      # ============================================================
      - name: Verify Tailscale Connection
        run: |
          echo "=========================================="
          echo "Verifying Tailscale Connection"
          echo "=========================================="
          
          TS_IP=$(tailscale ip -4)
          
          if [ -z "$TS_IP" ]; then
            echo "❌ ERROR: Failed to get Tailscale IP"
            exit 1
          fi
          
          echo "✅ Tailscale IP: $TS_IP"
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV
          
          tailscale status

      # ============================================================
      # 7. PREPARE DOCKER COMPOSE OVERRIDE
      # ============================================================
      - name: Create Docker Compose Override
        run: |
          echo "=========================================="
          echo "Creating Docker Compose Override"
          echo "=========================================="
          
          echo "services:" > docker-compose.override.yml
          echo "  ui:" >> docker-compose.override.yml
          echo "    ports:" >> docker-compose.override.yml
          echo "      - \"0.0.0.0:5173:5173\"" >> docker-compose.override.yml
          echo "    environment:" >> docker-compose.override.yml
          echo "      - VITE_BACKEND_URL=http://localhost:8765" >> docker-compose.override.yml
          echo "  backend:" >> docker-compose.override.yml
          echo "    ports:" >> docker-compose.override.yml
          echo "      - \"0.0.0.0:8765:8765\"" >> docker-compose.override.yml
          
          echo "✅ Override file created"
          cat docker-compose.override.yml

      # ============================================================
      # 8. START CLIPS STUDIO STACK
      # ============================================================
      - name: Start Clips Studio (Docker Compose)
        run: |
          echo "=========================================="
          echo "Starting Clips Studio Stack"
          echo "=========================================="
          
          DOCKER_GATEWAY=$(ip route show dev docker0 | awk '/default/ {print $3}')
          if [ -z "$DOCKER_GATEWAY" ]; then
            DOCKER_GATEWAY="172.17.0.1"
          fi
          
          echo "Docker Gateway: $DOCKER_GATEWAY"
          export OLLAMA_HOST="http://$DOCKER_GATEWAY:11434"
          echo "Ollama for Docker: $OLLAMA_HOST"
          
          echo ""
          echo "Pulling latest images..."
          docker compose -f docker-compose.yml -f docker-compose.override.yml pull
          
          echo ""
          echo "Starting services (excluding built-in Ollama)..."
          OLLAMA_HOST="$OLLAMA_HOST" \
            docker compose -f docker-compose.yml -f docker-compose.override.yml up -d --scale ollama=0
          
          echo ""
          echo "Waiting for services to stabilize..."
          sleep 10
          
          echo ""
          echo "Docker containers status:"
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps

      # ============================================================
      # 9. WAIT FOR UI TO BE READY
      # ============================================================
      - name: Wait for Clips Studio UI
        run: |
          echo "=========================================="
          echo "Waiting for UI Service"
          echo "=========================================="
          
          for i in {1..60}; do
            if curl -sf http://127.0.0.1:5173 > /dev/null 2>&1; then
              echo "✅ UI is ready on port 5173"
              exit 0
            fi
            echo "   Attempt $i/60 - waiting..."
            sleep 2
          done
          
          echo "❌ UI did not respond within 120 seconds"
          exit 1

      # ============================================================
      # 10. VERIFY PORT BINDINGS
      # ============================================================
      - name: Verify Port Bindings
        run: |
          echo "=========================================="
          echo "Verifying Port Bindings"
          echo "=========================================="
          
          sudo ss -lntp | grep -E ':(5173|8765|11434)' || echo "⚠️ Some ports not found in ss output"
          
          echo ""
          echo "Docker port mappings:"
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps --format "table {{.Names}}\t{{.Ports}}"

      # ============================================================
      # 11. TEST CONNECTIVITY
      # ============================================================
      - name: Test Local & Tailscale Connectivity
        run: |
          echo "=========================================="
          echo "Testing Connectivity"
          echo "=========================================="
          
          TS_IP=$(tailscale ip -4)
          
          echo "Testing UI (localhost:5173)..."
          curl -I http://127.0.0.1:5173 2>&1 | head -5 || echo "⚠️ localhost UI non-responsive"
          
          echo "Testing Backend (localhost:8765)..."
          curl -I http://127.0.0.1:8765 2>&1 | head -5 || echo "⚠️ localhost Backend non-responsive"
          
          echo "Testing UI via Tailscale ($TS_IP:5173)..."
          HTTP_CODE=$(curl --connect-timeout 10 --max-time 20 -s -o /dev/null -w "%{http_code}" "http://$TS_IP:5173" 2>&1 || echo "000")
          echo "HTTP Code: $HTTP_CODE"

      # ============================================================
      # 12. DISPLAY ACCESS INFORMATION
      # ============================================================
      - name: Display Access Information
        run: |
          TS_IP=$(tailscale ip -4)
          
          echo ""
          echo "======================================================"
          echo "           ✅ CLIPS STUDIO IS READY"
          echo "======================================================"
          echo "Web Interface:   http://$TS_IP:5173"
          echo "Backend API:     http://$TS_IP:8765"
          echo "Ollama API:      http://$TS_IP:11434"
          echo "======================================================"

      # ============================================================
      # 13. KEEP WORKFLOW RUNNING
      # ============================================================
      - name: Keep Clips Studio Running
        run: |
          TS_IP=$(tailscale ip -4)
          
          while true; do
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ✅ Clips Studio active | Access: http://$TS_IP:5173"
            sleep 300
          done

      # ============================================================
      # 14. DIAGNOSTIC REPORT ON FAILURE
      # ============================================================
      - name: Detailed Diagnostic Report
        if: failure()
        run: |
          echo "======================================================"
          echo "❌ WORKFLOW FAILURE DIAGNOSTICS"
          echo "======================================================"
          
          echo "--- Directory Contents ---"
          ls -la
          
          echo "--- Docker Containers ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml ps -a || docker ps -a
          
          echo "--- Recent Docker Logs ---"
          docker compose -f docker-compose.yml -f docker-compose.override.yml logs --tail=50 || true
          
          echo "--- Ollama Logs ---"
          cat /tmp/ollama.log | tail -30 || true

      # ============================================================
      # 15. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        run: |
          echo "Stopping Clips Studio services..."
          docker compose down || true
          
          echo "Disconnecting Tailscale..."
          sudo tailscale logout || true
