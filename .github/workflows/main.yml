name: Clips Studio

on:
  workflow_dispatch:

concurrency:
  group: clips-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clips-studio:
    runs-on: ubuntu-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Clips Studio
        uses: actions/checkout@v4
        with:
          repository: ColinGPT9/clips-studio

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Show Tailscale information
        run: |
          echo "Tailscale IP:"
          tailscale ip -4

          echo "Tailscale status:"
          tailscale status

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

          sudo systemctl stop ollama || true

          OLLAMA_HOST=0.0.0.0:11434 ollama serve > /tmp/ollama.log 2>&1 &

          echo "Waiting for Ollama..."

          until curl -sf http://127.0.0.1:11434/api/tags >/dev/null; do
            sleep 2
          done

          echo "Ollama is ready."

          ollama pull gemma:7b

      - name: Start Clips Studio
        run: |
          docker compose pull

          docker compose up -d --scale ollama=0

          echo "Waiting for Clips Studio..."

          for i in {1..60}; do
            if curl -sf http://127.0.0.1:5173 >/dev/null; then
              echo "UI is ready."
              break
            fi
            sleep 2
          done

      - name: Verify network access
        run: |
          TS_IP=$(tailscale ip -4)

          echo "======================================"
          echo "Tailscale IP: $TS_IP"
          echo "======================================"

          echo ""
          echo "Local UI:"
          curl -I http://127.0.0.1:5173 || true

          echo ""
          echo "Tailscale UI:"
          curl -I http://$TS_IP:5173 || true

          echo ""
          echo "Engine:"
          curl -I http://127.0.0.1:8765 || true

          echo ""
          echo "Ollama:"
          curl -s http://127.0.0.1:11434/api/tags || true

          echo ""
          echo "======================================"
          echo "OPEN THIS:"
          echo "http://$TS_IP:5173"
          echo "======================================"

      - name: Keep Clips Studio running
        run: |
          TS_IP=$(tailscale ip -4)

          echo "Clips Studio is running."
          echo "Web UI: http://$TS_IP:5173"
          echo "Engine: http://$TS_IP:8765"

          while true; do
            echo "[$(date)] Clips Studio active"
            sleep 300
          done
