name: AutoClip - AI Video Processing Runner

on:
  workflow_dispatch:
    inputs:
      duration_hours:
        description: 'Hours to keep application alive (1-6)'
        required: false
        default: '5'

concurrency:
  group: autoclip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoclip:
    name: Run AutoClip & Cloudflare Tunnel
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout AutoClip Repository
        uses: actions/checkout@v4
        with:
          repository: zhouxiaoka/autoclip
          ref: main

      - name: Clean Runner Disk Space
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Clearing non-essential cached tooling to free disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h

      - name: Prepare Storage Directories & Permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data logs uploads projects output
          chmod -R 777 data logs uploads projects output
          echo "✅ Local storage directories ready."

      - name: Setup Environment Configuration
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: |
          set -Eeuo pipefail

          if [[ -f "env.example" ]]; then
            cp env.example .env
          else
            touch .env
          fi

          cat >> .env << EOF

          # ===== GENERATED PRODUCTION OVERRIDES =====
          ENVIRONMENT=production
          DEBUG=false
          LOG_LEVEL=INFO

          # ===== LLM ROUTING =====
          LLM_PROVIDER=${LLM_PROVIDER:-openai}
          OPENAI_API_KEY=${OPENAI_API_KEY:-}
          OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}

          # ===== INTERNAL STORAGE & SERVICES =====
          DATABASE_URL=sqlite:////app/data/autoclip.db
          REDIS_URL=redis://redis:6379/0

          UPLOAD_DIR=/app/data/uploads
          PROJECT_DIR=/app/data/projects
          EOF

          echo "✅ Environment configuration assembled."

      - name: Start Docker Services
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Pulling base images and building AutoClip service..."
          docker compose pull --ignore-pull-failures || true
          docker compose up -d --build

      - name: Automated Diagnostics & Health Verification
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "================ DOCKER CONTAINER LIST ================"
          docker compose ps

          echo "================ TESTING LOCAL PORT RESPONSES ================"
          TIMEOUT=60
          ELAPSED=0
          SUCCESS=false

          while [[ $ELAPSED -lt $TIMEOUT ]]; do
            if curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1 || curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            echo "⏳ Service initializing... (${ELAPSED}s / ${TIMEOUT}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [[ "$SUCCESS" == "false" ]]; then
            echo "❌ Health check failed. Printing recent container logs:"
            docker compose logs --tail=100
            exit 1
          fi

          echo "================ PORT 8000 HTTP RESPONSE HEADER ================"
          curl -i -s http://127.0.0.1:8000/ | head -n 25 || true

          echo "✅ AutoClip backend verified healthy on port 8000!"

      - name: Install Cloudflare CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -L -o cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

      - name: Launch Cloudflare Tunnel
        shell: bash
        env:
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          set -Eeuo pipefail

          if [[ -n "${CLOUDFLARE_TUNNEL_TOKEN:-}" ]]; then
            echo "Launching Cloudflare Managed Tunnel via Token..."
            cloudflared tunnel --no-autoupdate run --token "${CLOUDFLARE_TUNNEL_TOKEN}" > cloudflared.log 2>&1 &
            echo "✅ Named tunnel initiated in background."
          else
            echo "No CLOUDFLARE_TUNNEL_TOKEN set. Launching ephemeral trycloudflare tunnel..."
            cloudflared tunnel --url http://127.0.0.1:8000 --http-host-header="localhost" --protocol http2 --logfile cloudflared.log &

            echo "Awaiting Cloudflare URL assignment..."
            TUNNEL_URL=""
            for i in {1..30}; do
              if [[ -f cloudflared.log ]]; then
                TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' cloudflared.log | head -n 1 || true)
                if [[ -n "$TUNNEL_URL" ]]; then
                  echo "======================================================"
                  echo "🚀 AUTOCLIP PUBLIC WEB INTERFACE AVAILABLE AT:"
                  echo "👉 $TUNNEL_URL"
                  echo "======================================================"
                  break
                fi
              fi
              sleep 2
            done

            if [[ -z "$TUNNEL_URL" ]]; then
              echo "❌ Cloudflare tunnel failed to assign a public URL. Printing cloudflared.log:"
              cat cloudflared.log
              exit 1
            fi
          fi

      - name: Monitor Application Lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail

          HOURS="${{ github.event.inputs.duration_hours }}"
          HOURS=${HOURS:-5}
          MAX_SECONDS=$((HOURS * 3600))
          INTERVAL=30
          ELAPSED=0

          echo "Starting continuous health monitoring for ${HOURS} hour(s) (${MAX_SECONDS} seconds)..."

          while [[ $ELAPSED -lt $MAX_SECONDS ]]; do
            if ! docker compose ps | grep -q "Up"; then
              echo "❌ ERROR: One or more Docker services stopped unexpectedly!"
              exit 1
            fi

            if ! pgrep -x "cloudflared" > /dev/null; then
              echo "❌ ERROR: Cloudflare tunnel process exited!"
              exit 1
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))

            if [[ $((ELAPSED % 300)) -eq 0 ]]; then
              echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Application status verified normal ($ELAPSED / $MAX_SECONDS seconds elapsed)."
            fi
          done

          echo "✅ Operational window completed successfully."

      - name: Failure Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e
          echo "================ DOCKER CONTAINER STATUS ================"
          docker compose ps
          echo "================ DOCKER CONTAINER LOGS ================"
          docker compose logs --tail=200
          echo "================ CLOUDFLARE TUNNEL LOGS ================"
          cat cloudflared.log 2>&1 || true

      - name: Clean Up Infrastructure
        if: always()
        shell: bash
        run: |
          set +e
          pkill -f cloudflared || true
          docker compose down --volumes --remove-orphans || true
