name: AutoClip - AI Video Processing Runner

on:
  workflow_dispatch:

concurrency:
  group: autoclip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoclip:
    name: Run AutoClip & Tmate Port Forwarding
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout AutoClip Repository
        uses: actions/checkout@v4
        with:
          repository: zhouxiaoka/autoclip
          ref: main

      - name: Clean Runner Disk Space
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Clearing non-essential cached tooling to free disk space..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup
          df -h

      - name: Prepare Storage Directories & Permissions
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p data logs uploads projects output
          chmod -R 777 data logs uploads projects output
          echo "✅ Local storage directories ready."

      - name: Setup Environment Configuration
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
        run: |
          set -Eeuo pipefail

          if [[ -f "env.example" ]]; then
            cp env.example .env
          else
            touch .env
          fi

          cat >> .env << EOF

          # ===== GENERATED PRODUCTION OVERRIDES =====
          ENVIRONMENT=production
          DEBUG=false
          LOG_LEVEL=INFO

          # ===== LLM ROUTING =====
          LLM_PROVIDER=${LLM_PROVIDER:-openai}
          OPENAI_API_KEY=${OPENAI_API_KEY:-}
          OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}

          # ===== INTERNAL STORAGE & SERVICES =====
          DATABASE_URL=sqlite:////app/data/autoclip.db
          REDIS_URL=redis://redis:6379/0

          UPLOAD_DIR=/app/data/uploads
          PROJECT_DIR=/app/data/projects
          EOF

          echo "✅ Environment configuration assembled."

      - name: Start Docker Services
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Pulling base images and building AutoClip service..."
          docker compose pull --ignore-pull-failures || true
          docker compose up -d --build

      - name: Verify Service Health
        shell: bash
        run: |
          set +e

          echo "================ TESTING LOCAL PORT RESPONSES ================"
          TIMEOUT=90
          ELAPSED=0
          SUCCESS=false

          while [[ $ELAPSED -lt $TIMEOUT ]]; do
            if curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1 || curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              SUCCESS=true
              break
            fi
            echo "⏳ Service initializing... (${ELAPSED}s / ${TIMEOUT}s)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          if [[ "$SUCCESS" == "true" ]]; then
            echo "✅ AutoClip backend verified healthy on port 8000!"
          else
            echo "⚠️ Health check didn't pass within $TIMEOUT seconds. Starting Tmate anyway so you can debug live."
            docker compose logs --tail=50
          fi

      - name: Display Port Forwarding Banner
        if: always()
        shell: bash
        run: |
          echo "========================================================================"
          echo "🌐 CONNECT TO YOUR AUTOCLIP APP FROM YOUR LAPTOP"
          echo "========================================================================"
          echo "1. Expand the 'Setup Tmate SSH Session' step below."
          echo "2. Find the line starting with 'SSH:'."
          echo "3. Copy the SSH command and add '-L 8000:localhost:8000' right after 'ssh'."
          echo "4. Example syntax:"
          echo "   ssh -L 8000:localhost:8000 <user>@<host>.tmate.io -p <port>"
          echo "========================================================================"

      - name: Setup Tmate SSH Session
        uses: mxschmitt/action-tmate@v3
        if: always()
        with:
          limit-access-to-actor: false

      - name: Clean Up Infrastructure
        if: always()
        shell: bash
        run: |
          set +e
          echo "Shutting down Docker containers..."
          docker compose down --volumes --remove-orphans || true
