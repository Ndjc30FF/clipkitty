name: AutoClip Setup and Shell Environment

on:
  workflow_dispatch:

jobs:
  autoclip-environment:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      - name: "Install System Dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg git curl python3 python3-pip python3-venv tmux jq wget unzip
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs

      - name: "Clone AutoClip and Install Dependencies"
        run: |
          git clone https://github.com/zhouxiaoka/autoclip.git
          cd autoclip
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt
          cd frontend
          npm install

      - name: "Open Interactive Web Terminal"
        uses: owenthereal/action-upterm@v1
