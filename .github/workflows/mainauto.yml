name: AutoClip - AI Video Processing Runner

on:
  workflow_dispatch:

concurrency:
  group: autoclip-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoclip:
    name: Run AutoClip Video Processing
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      # ============================================================
      # 1. CHECKOUT REPOSITORY
      # ============================================================

      - name: Checkout AutoClip Repository
        uses: actions/checkout@v4
        with:
          repository: zhouxiaoka/autoclip
          ref: main
          fetch-depth: 1

      # ============================================================
      # 2. SYSTEM INFORMATION & DIAGNOSTICS
      # ============================================================

      - name: Show System Information
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "AUTOCLIP - AI VIDEO INTELLIGENT CLIPPING SYSTEM"
          echo "======================================================"

          echo "Working directory: $(pwd)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "OS: $(uname -a)"
          echo "CPU cores: $(nproc)"
          free -h
          df -h

      # ============================================================
      # 3. VERIFY REPOSITORY STRUCTURE
      # ============================================================

      - name: Verify Repository Files
        shell: bash
        run: |
          set -Eeuo pipefail

          required_files=("docker-compose.yml" "env.example" "README-EN.md")
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ REQUIRED FILE MISSING: $file"
              ls -la
              exit 1
            fi
            echo "✅ Found: $file"
          done

      # ============================================================
      # 4. SETUP ENVIRONMENT VARIABLES
      # ============================================================

      - name: Setup Environment Configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          cp env.example .env

          cat >> .env << 'EOF'

          # ===== LLM CONFIGURATION =====
          LLM_PROVIDER=ollama
          API_MODEL_NAME=qwen2.5:7b

          # For Ollama local model setup
          OPENAI_BASE_URL=http://host.docker.internal:11434/v1

          LOG_LEVEL=INFO
          ENVIRONMENT=production
          DEBUG=false

          DATABASE_URL=sqlite:///./data/autoclip.db
          REDIS_URL=redis://redis:6379/0

          UPLOAD_DIR=./data/uploads
          PROJECT_DIR=./data/projects
          EOF

          echo "✅ Environment configuration successfully generated."

      # ============================================================
      # 5. PREPARE DATA DIRECTORIES
      # ============================================================

      - name: Prepare Data Directories
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p data logs uploads
          chmod -R 777 data logs uploads
          echo "✅ Prepared local storage directories."

      # ============================================================
      # 6. PULL PUBLIC DOCKER IMAGES
      # ============================================================

      - name: Pull External Base Images
        shell: bash
        run: |
          set -Eeuo pipefail

          # Only pull external dependencies (Redis, etc.) and ignore local builds
          docker compose pull --ignore-pull-failures || true

      # ============================================================
      # 7. BUILD LOCAL DOCKER IMAGES FROM SOURCE
      # ============================================================

      - name: Build Docker Images from Source
        shell: bash
        run: |
          set -Eeuo pipefail

          # Build autoclip:local image directly from root Dockerfile
          docker compose build --no-cache autoclip

      # ============================================================
      # 8. START AUTOCLIP SERVICES
      # ============================================================

      - name: Start AutoClip Services
        shell: bash
        run: |
          set -Eeuo pipefail

          docker compose up -d

          echo "Waiting 20s for container initializations..."
          sleep 20

      # ============================================================
      # 9. VERIFY SERVICES & UI HEALTH CHECK (15 ATTEMPTS)
      # ============================================================

      - name: Wait for Services and Web UI
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Checking Backend API (Port 8000)..."
          for i in {1..15}; do
            if curl -sf http://127.0.0.1:8000/api/v1/health/ > /dev/null 2>&1 || curl -sf http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "✅ Backend API is live!"
              break
            fi
            echo "⏳ Attempt $i/15 - Waiting for Backend API..."
            sleep 3
          done

          echo "Checking Web UI (Port 3000)..."
          for i in {1..15}; do
            if curl -sL --connect-timeout 2 http://127.0.0.1:3000 > /dev/null 2>&1; then
              echo "✅ Web UI is live!"
              break
            fi
            echo "⏳ Attempt $i/15 - Waiting for Web UI..."
            sleep 3
          done

      # ============================================================
      # 10. INSTALL CLOUDFLARE TUNNEL
      # ============================================================

      - name: Install Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # ============================================================
      # 11. START CLOUDFLARE TUNNELS & EXPOSE PUBLIC URLS
      # ============================================================

      - name: Expose Services via Cloudflare Tunnel
        shell: bash
        run: |
          set -Eeuo pipefail

          cloudflared tunnel --url http://localhost:3000 > ui_tunnel.log 2>&1 &
          cloudflared tunnel --url http://localhost:8000 > api_tunnel.log 2>&1 &

          sleep 12

          UI_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' ui_tunnel.log | head -n 1 || echo "Tunnel pending")
          API_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' api_tunnel.log | head -n 1 || echo "Tunnel pending")

          echo "======================================================"
          echo "🌐 CLOUDFLARE PUBLIC ACCESS URLS"
          echo "======================================================"
          echo "🚀 Web Interface URL:  $UI_URL"
          echo "🔗 Backend API URL:    $API_URL"
          echo "📚 API Docs:            $API_URL/docs"
          echo "======================================================"

      # ============================================================
      # 12. KEEP RUNNING & MONITOR SERVICES
      # ============================================================

      - name: Keep Runner Active & Stream Tunnel Logs
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "======================================================"
          echo "AUTOCLIP RUNNING - MONITORING TUNNEL & CONTAINERS"
          echo "======================================================"

          while true; do
            echo ""
            echo "[$(date -u '+%Y-%m-%d %H:%M:%S UTC')] Health Status:"
            docker compose ps
            
            UI_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' ui_tunnel.log | head -n 1 || echo "")
            if [[ -n "$UI_URL" ]]; then
              echo "Public UI Active at: $UI_URL"
            fi

            sleep 300
          done

      # ============================================================
      # 13. FAILURE DIAGNOSTICS
      # ============================================================

      - name: Failure Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e

          echo "========== CONTAINER LOGS =========="
          docker compose logs --tail=100 2>&1 || true

          echo "========== CLOUDFLARE UI TUNNEL LOGS =========="
          cat ui_tunnel.log 2>&1 || true

          echo "========== CLOUDFLARE API TUNNEL LOGS =========="
          cat api_tunnel.log 2>&1 || true

      # ============================================================
      # 14. CLEANUP
      # ============================================================

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          pkill cloudflared || true
          docker compose down 2>&1 || true
