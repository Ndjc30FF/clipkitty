name: Deploy Autoclip via Cloudflare Tunnel

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration to keep application running (in hours)'
        required: false
        default: '2'
        type: number

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 1500  # Max 24h + 1h buffer

    steps:
      - name: Checkout autoclip repository
        uses: actions/checkout@v4
        with:
          repository: zhouxiaoka/autoclip
          path: autoclip

      - name: Set up environment
        working-directory: autoclip
        run: |
          cp env.example .env
          mkdir -p data logs uploads

      - name: Verify Docker and Docker Compose
        run: |
          echo "Verifying Docker and Docker Compose..."
          docker --version
          docker compose version

      - name: Validate Docker Compose configuration
        run: |
          echo "Validating Docker Compose configuration..."
          docker compose config

      - name: Start application with Docker Compose
        working-directory: autoclip
        run: |
          echo "Starting application with Docker Compose..."
          docker compose up -d

      - name: Wait for autoclip service to be ready
        working-directory: autoclip
        run: |
          echo "Waiting for autoclip service to be ready..."
          for i in {1..30}; do
            if docker compose exec -T autoclip curl -s -f http://localhost:8000/api/v1/health/ > /dev/null 2>&1; then
              echo "Autoclip service is ready!"
              break
            fi
            echo "Waiting for autoclip service... ($i/30)"
            sleep 2
          done

          # If the loop ended without breaking, then the service is not ready.
          if ! docker compose exec -T autoclip curl -s -f http://localhost:8000/api/v1/health/ > /dev/null 2>&1; then
            echo "Autoclip service failed to become ready."
            exit 1
          fi

      - name: Install Cloudflare Tunnel (cloudflared)
        run: |
          echo "Installing Cloudflare Tunnel..."
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb
          cloudflared version

      - name: Create tunnel and expose port 3000
        id: tunnel
        working-directory: autoclip
        run: |
          echo "Creating Cloudflare Tunnel for port 3000..."
          # Start tunnel in background with nohup
          nohup cloudflared tunnel --url http://localhost:3000 > tunnel.log 2>&1 &
          echo $! > tunnel.pid

          # Wait for tunnel to be ready and get the URL
          echo "Waiting for tunnel to establish..."
          for i in {1..30}; do
            if TUNNEL_URL=$(grep -oE 'https://[^ ]+.trycloudflare.com' tunnel.log | head -1); then
              if [ -n "$TUNNEL_URL" ]; then
                echo "Tunnel URL: $TUNNEL_URL"
                break
              fi
            fi
            sleep 1
          done

          if [ -z "$TUNNEL_URL" ]; then
            echo "Failed to get tunnel URL"
            cat tunnel.log
            kill $(cat tunnel.pid) || true
            rm -f tunnel.pid
            exit 1
          fi

          echo "TUNNEL_URL=$TUNNEL_URL" >> $GITHUB_ENV
          echo "tunnel_url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      - name: Display public URL
        run: |
          echo "🚀 Autoclip application is now accessible at:"
          echo "🔗 $TUNNEL_URL"
          echo "📝 Note: This URL will be valid for the duration of this workflow run."

      - name: Keep application running
        run: |
          HOURS=${{ github.event.inputs.duration }}
          SECONDS=$((HOURS * 3600))
          echo "Keeping application running for ${HOURS} hour(s)..."

          # Simple heartbeat to show the job is still running
          for i in $(seq 1 $SECONDS); do
            if [ $((i % 60)) -eq 0 ]; then
              echo "⏱️  Application running... [$((i/60)) minutes elapsed]"
            fi
            sleep 1
          done

      - name: Cleanup
        if: always()
        working-directory: autoclip
        run: |
          echo "Stopping application and cleaning up..."
          docker compose down
          if [ -f tunnel.pid ]; then
            kill $(cat tunnel.pid) || true
            rm -f tunnel.pid
          fi

      - name: Failure diagnostics
        if: failure()
        working-directory: autoclip
        run: |
          echo "=== Failure Diagnostics ==="
          echo "Container status:"
          docker compose ps -a
          echo ""
          echo "Container logs:"
          docker compose logs --tail=100
          echo ""
          echo "Tunnel log (if exists):"
          if [ -f tunnel.log ]; then
            cat tunnel.log
          else
            echo "No tunnel log found."
          fi