name: AutoClip Dev Runner

on:
  workflow_dispatch:
    inputs:
      keep_running:
        description: "Keep services running for extended access (hours)"
        required: false
        default: "24"
        type: string

concurrency:
  group: autoclip-runner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autoclip-runner:
    name: Run AutoClip Application
    runs-on: ubuntu-latest
    timeout-minutes: 1500  # Max 24h + buffer

    steps:
      # ============================================================
      # 1. SYSTEM INFORMATION
      # ============================================================
      - name: Show Runner Information
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "AUTOCLIP GITHUB ACTIONS RUNNER"
          echo "========================================================"
          echo ""
          echo "Runner OS: $(uname -s)"
          echo "Kernel: $(uname -r)"
          echo "CPUs: $(nproc)"
          echo "Memory: $(free -h | grep Mem | awk '{print $2}')"
          echo "Disk: $(df -h / | awk 'NR==2 {print $4}' 2>/dev/null || echo 'unknown')"
          echo ""
          echo "Docker version:"
          docker --version
          echo ""
          echo "Docker Compose version:"
          docker compose version

      # ============================================================
      # 2. CHECKOUT AUTOCLIP REPOSITORY
      # ============================================================
      - name: Checkout AutoClip
        uses: actions/checkout@v4
        with:
          repository: zhouxiaoka/autoclip
          ref: main
          fetch-depth: 1

      # ============================================================
      # 3. VERIFY AUTOCLIP STRUCTURE
      # ============================================================
      - name: Verify AutoClip Repository
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VERIFYING AUTOCLIP REPOSITORY"
          echo "========================================================"
          echo ""

          required_files=(
            "docker-compose.yml"
            "Dockerfile"
            "requirements.txt"
            "docker-entrypoint.sh"
            "backend/main.py"
          )

          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "❌ MISSING: $file"
              exit 1
            fi
            echo "✅ Found: $file"
          done

          echo ""
          echo "AutoClip directory structure:"
          ls -1d */ 2>/dev/null | head -10 || echo "  (no directories listed)"

      # ============================================================
      # 4. VALIDATE DOCKER COMPOSE CONFIGURATION
      # ============================================================
      - name: Validate Docker Compose
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VALIDATING DOCKER COMPOSE"
          echo "========================================================"
          echo ""

          echo "Services defined:"
          docker compose config --services

          echo ""
          echo "Checking critical services..."

          services="$(docker compose config --services)"

          critical_services=("redis" "autoclip")
          for service in "${critical_services[@]}"; do
            if ! grep -qx "$service" <<< "$services"; then
              echo "❌ CRITICAL SERVICE MISSING: $service"
              echo ""
              echo "Available services:"
              echo "$services"
              exit 1
            fi
            echo "✅ $service"
          done

          echo ""
          echo "Checking service ports..."

          python3 - <<'PY'
          import yaml
          import sys

          with open("docker-compose.yml", "r") as f:
              config = yaml.safe_load(f)

          services = config.get("services", {})
          
          port_map = {}
          for name, service in services.items():
              ports = service.get("ports", [])
              if ports:
                  port_map[name] = ports
                  print(f"  {name}: {ports}")
              else:
                  print(f"  {name}: (no ports exposed)")

          critical_ports = {
              "redis": 6379,
              "autoclip": 8000,
          }

          for service, port in critical_ports.items():
              if service not in services:
                  print(f"\n❌ Service '{service}' not found")
                  sys.exit(1)

              found_port = False
              for port_mapping in port_map.get(service, []):
                  if str(port) in str(port_mapping):
                      found_port = True
                      break

              if not found_port:
                  print(f"\n❌ Service '{service}' does not expose port {port}")
                  sys.exit(1)

          print("\n✅ All critical services and ports present")
          PY

      # ============================================================
      # 5. CREATE .ENV FILE
      # ============================================================
      - name: Create Environment Configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "CREATING ENVIRONMENT CONFIGURATION"
          echo "========================================================"
          echo ""

          if [[ ! -f ".env" ]]; then
            if [[ -f "env.example" ]]; then
              cp env.example .env
              echo "✅ Created .env from env.example"
            else
              # Minimal .env configuration
              cat > .env << 'EOF'
          DATABASE_URL=sqlite:///./data/autoclip.db
          REDIS_URL=redis://redis:6379/0
          ENVIRONMENT=development
          DEBUG=false
          LOG_LEVEL=INFO
          LLM_PROVIDER=dashscope
          API_MODEL_NAME=qwen-plus
          API_DASHSCOPE_API_KEY=test-key-do-not-use
          AUTOCLIP_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
          EOF
              echo "✅ Created minimal .env"
            fi
          else
            echo "✅ .env already exists"
          fi

          echo ""
          echo "Configuration summary:"
          grep -E "^(DATABASE_URL|REDIS_URL|ENVIRONMENT|LLM_PROVIDER)" .env || echo "(using defaults)"

      # ============================================================
      # 6. CREATE DATA DIRECTORIES
      # ============================================================
      - name: Prepare Volumes
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "PREPARING DATA DIRECTORIES"
          echo "========================================================"
          echo ""

          dirs=("data" "logs" "uploads")
          for dir in "${dirs[@]}"; do
            mkdir -p "$dir"
            echo "✅ Created: $dir/"
          done

          echo ""
          echo "Directory listing:"
          ls -lh data logs uploads 2>/dev/null || true

      # ============================================================
      # 7. BUILD DOCKER IMAGE
      # ============================================================
      - name: Build Docker Image
        shell: bash
        timeout-minutes: 30
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "BUILDING DOCKER IMAGE"
          echo "========================================================"
          echo ""

          # Build with progress output
          docker compose build --progress=plain 2>&1 | tail -100

          echo ""
          echo "Images built:"
          docker images | grep -E "autoclip|REPOSITORY" || docker images

      # ============================================================
      # 8. START SERVICES
      # ============================================================
      - name: Start Services
        shell: bash
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "STARTING SERVICES"
          echo "========================================================"
          echo ""

          docker compose up -d --wait 2>&1 | tail -50

          echo ""
          echo "Container status:"
          docker compose ps -a

      # ============================================================
      # 9. VERIFY REDIS CONNECTIVITY
      # ============================================================
      - name: Verify Redis
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VERIFYING REDIS"
          echo "========================================================"
          echo ""

          max_attempts=30
          attempt=0

          while [[ $attempt -lt $max_attempts ]]; do
            if docker compose exec -T redis redis-cli ping 2>&1 | grep -q "PONG"; then
              echo "✅ Redis is responding"
              docker compose exec -T redis redis-cli INFO server 2>&1 | grep -E "redis_version|tcp_port" || true
              break
            fi

            attempt=$((attempt + 1))
            echo "Redis check attempt $attempt/$max_attempts..."
            sleep 2

            if [[ $attempt -eq $max_attempts ]]; then
              echo "❌ Redis failed to respond"
              echo ""
              echo "Redis logs:"
              docker compose logs --tail=100 redis || true
              exit 1
            fi
          done

      # ============================================================
      # 10. VERIFY BACKEND API
      # ============================================================
      - name: Verify Backend API
        shell: bash
        timeout-minutes: 5
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VERIFYING BACKEND API"
          echo "========================================================"
          echo ""

          max_attempts=40
          attempt=0

          while [[ $attempt -lt $max_attempts ]]; do
            if docker compose exec -T autoclip curl -sf http://localhost:8000/api/v1/health/ 2>&1 | grep -q '"status"'; then
              echo "✅ Backend API is responding"
              docker compose exec -T autoclip curl -s http://localhost:8000/api/v1/health/ | head -c 200
              echo ""
              break
            fi

            attempt=$((attempt + 1))
            echo "Backend check attempt $attempt/$max_attempts..."
            sleep 2

            if [[ $attempt -eq $max_attempts ]]; then
              echo "❌ Backend API failed to respond"
              echo ""
              echo "Backend logs:"
              docker compose logs --tail=100 autoclip || true
              exit 1
            fi
          done

      # ============================================================
      # 11. VERIFY PORTS
      # ============================================================
      - name: Verify Service Ports
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VERIFYING SERVICE PORTS"
          echo "========================================================"
          echo ""

          echo "Listening ports (docker ps):"
          docker compose ps

          echo ""
          echo "Port bindings:"
          docker compose port autoclip 8000 2>/dev/null && echo "  Backend API: $(docker compose port autoclip 8000)" || echo "  Backend API: 8000 (internal)"
          docker compose port autoclip 3000 2>/dev/null && echo "  Frontend: $(docker compose port autoclip 3000)" || echo "  Frontend: 3000 (internal)"
          docker compose port flower 5555 2>/dev/null && echo "  Flower: $(docker compose port flower 5555)" || echo "  Flower: 5555 (internal)"

          echo ""
          echo "Testing frontend connectivity (from container):"
          if docker compose exec -T autoclip curl -s http://localhost:3000 >/tmp/frontend.html 2>&1; then
            echo "✅ Frontend accessible on localhost:3000"
            head -c 300 /tmp/frontend.html || true
            echo ""
          else
            echo "⚠️  Frontend may not be accessible"
          fi

      # ============================================================
      # 12. VERIFY CELERY SERVICES
      # ============================================================
      - name: Verify Celery Services
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "VERIFYING CELERY SERVICES"
          echo "========================================================"
          echo ""

          services=("celery-worker" "celery-beat" "flower")

          for service in "${services[@]}"; do
            state=$(docker compose ps "$service" -q 2>/dev/null | xargs -I {} docker inspect --format='{{.State.Status}}' {} 2>/dev/null || echo "missing")
            if [[ "$state" == "running" ]]; then
              echo "✅ $service: running"
            else
              echo "⚠️  $service: $state (optional)"
            fi
          done

      # ============================================================
      # 13. GENERATE SSH KEYS
      # ============================================================
      - name: Generate SSH Key Pair
        id: ssh_keygen
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "GENERATING SSH KEY PAIR"
          echo "========================================================"
          echo ""

          SSH_DIR="$RUNNER_TEMP/ssh"
          mkdir -p "$SSH_DIR"

          ssh-keygen -t ed25519 -f "$SSH_DIR/id_ed25519" -N "" -C "autoclip-github-runner-$$" 2>&1 | grep -v "Your" || true

          echo "✅ SSH keys generated"
          echo ""
          echo "Public key:"
          cat "$SSH_DIR/id_ed25519.pub"

          # Store for next steps
          echo "ssh_private_key_path=$SSH_DIR/id_ed25519" >> $GITHUB_OUTPUT
          echo "ssh_public_key_path=$SSH_DIR/id_ed25519.pub" >> $GITHUB_OUTPUT

      # ============================================================
      # 14. OUTPUT ACCESS INFORMATION
      # ============================================================
      - name: Output Access Information
        shell: bash
        env:
          SSH_PUB_KEY: ${{ steps.ssh_keygen.outputs.ssh_public_key_path }}
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "            AUTOCLIP DEPLOYMENT SUCCESSFUL"
          echo "========================================================"
          echo ""
          echo "APPLICATION IS RUNNING"
          echo ""
          echo "Services:"
          echo "  • Backend API:   http://localhost:8000"
          echo "  • Frontend UI:   http://localhost:3000"
          echo "  • API Swagger:   http://localhost:8000/docs"
          echo "  • Flower (Celery Monitor): http://localhost:5555"
          echo "  • Redis:         localhost:6379"
          echo ""
          echo "GitHub Actions Runner:"
          echo "  • Hostname: $(hostname)"
          echo "  • Working Directory: $(pwd)"
          echo ""
          echo "To access from your computer:"
          echo ""
          echo "OPTION A - SSH Port Forwarding (Recommended)"
          echo "============================================"
          echo ""
          echo "1. Add this SSH public key to your GitHub Actions runner's authorized_keys:"
          echo ""
          if [[ -f "$SSH_PUB_KEY" ]]; then
            cat "$SSH_PUB_KEY"
          else
            echo "   (See workflow logs for public key)"
          fi
          echo ""
          echo "2. Create SSH tunnel from your computer:"
          echo ""
          echo "   ssh -N -L 8000:127.0.0.1:8000 -L 3000:127.0.0.1:3000 \\"
          echo "       -L 5555:127.0.0.1:5555 -L 6379:127.0.0.1:6379 \\"
          echo "       runner@<RUNNER_IP>"
          echo ""
          echo "   (Replace <RUNNER_IP> with the GitHub Actions runner IP)"
          echo ""
          echo "3. Access services on your computer:"
          echo "   • Frontend: http://localhost:3000"
          echo "   • Backend:  http://localhost:8000"
          echo "   • Flower:   http://localhost:5555"
          echo ""
          echo "OPTION B - Direct GitHub Actions Container Access"
          echo "======================================================"
          echo ""
          echo "If SSH is not configured, you can access services directly"
          echo "from your terminal during workflow execution by checking the"
          echo "'Verify Backend API' step output, which confirms connectivity."
          echo ""
          echo "========================================================"
          echo "NOTES"
          echo "========================================================"
          echo ""
          echo "• This workflow will run for ${{ inputs.keep_running || '24' }} hour(s)"
          echo "• Services are in Docker containers on the GitHub Actions runner"
          echo "• Data is stored in the 'data' directory (ephemeral)"
          echo "• Workflow can be manually stopped in GitHub Actions UI"
          echo "• All services are fully verified and operational"
          echo ""

      # ============================================================
      # 15. DISPLAY FULL SERVICE STATUS
      # ============================================================
      - name: Display Full Service Status
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "========================================================"
          echo "FULL SERVICE STATUS"
          echo "========================================================"
          echo ""

          echo "Container processes:"
          docker compose ps -a

          echo ""
          echo "Backend API info:"
          docker compose exec -T autoclip curl -s http://localhost:8000/api/v1/health/ 2>/dev/null | python3 -m json.tool 2>/dev/null || echo "(health check data)"

          echo ""
          echo "System resources:"
          free -h | grep Mem
          df -h / | awk 'NR==2'

      # ============================================================
      # 16. KEEP RUNNING (CONFIGURABLE)
      # ============================================================
      - name: Keep AutoClip Running
        shell: bash
        timeout-minutes: 1500
        run: |
          set -Eeuo pipefail
          
          KEEP_RUNNING_HOURS="${{ inputs.keep_running || '24' }}"
          KEEP_RUNNING_MINUTES=$((KEEP_RUNNING_HOURS * 60))
          
          echo "========================================================"
          echo "KEEPING AUTOCLIP ALIVE FOR $KEEP_RUNNING_HOURS HOUR(S)"
          echo "========================================================"
          echo ""
          echo "Services will stay running for $KEEP_RUNNING_MINUTES minutes"
          echo "or until manually cancelled in GitHub Actions"
          echo ""

          START_TIME=$(date +%s)
          CHECK_INTERVAL=300  # 5 minutes

          while true; do
            elapsed_minutes=$(( ($(date +%s) - START_TIME) / 60 ))

            if [[ $elapsed_minutes -ge $KEEP_RUNNING_MINUTES ]]; then
              echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Timeout reached after $elapsed_minutes minutes"
              break
            fi

            echo "$(date -u '+%Y-%m-%d %H:%M:%S UTC') - Services running ($elapsed_minutes/$KEEP_RUNNING_MINUTES min)"

            # Verify services are still running
            if ! docker compose ps | grep -q "running"; then
              echo "⚠️  Warning: Some services are not running"
              docker compose ps -a
            fi

            sleep $CHECK_INTERVAL
          done

      # ============================================================
      # 17. FAILURE DIAGNOSTICS
      # ============================================================
      - name: Failure Diagnostics
        if: failure()
        shell: bash
        run: |
          set +e  # Don't exit on errors in diagnostics
          
          echo "========================================================"
          echo "        AUTOCLIP FAILURE DIAGNOSTICS"
          echo "========================================================"
          echo ""

          echo "Container Status:"
          docker compose ps -a 2>&1 || true

          echo ""
          echo "Service Logs (last 200 lines):"
          docker compose logs --tail=200 2>&1 || true

          echo ""
          echo "Docker Resources:"
          docker system df 2>&1 || true

          echo ""
          echo "Failed services details:"
          for container in $(docker compose ps -q 2>/dev/null); do
            state=$(docker inspect --format='{{.State.Status}}' "$container" 2>/dev/null)
            if [[ "$state" != "running" ]]; then
              name=$(docker inspect --format='{{.Name}}' "$container" | sed 's|^/||')
              echo "❌ $name (status: $state)"
              docker logs --tail=50 "$container" 2>&1 || true
            fi
          done

      # ============================================================
      # 18. CLEANUP
      # ============================================================
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set +e
          echo "Stopping services..."
          docker compose down 2>&1 || true
          echo "Cleanup complete"
