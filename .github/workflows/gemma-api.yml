name: Run Gemma API via Cloudflare Tunnel

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Keeps runner alive up to 6 hours

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama & Cloudflared
        run: |
          # Install Ollama
          curl -fsSL https://ollama.com/install.sh | sh
          
          # Install Cloudflare Tunnel CLI
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Ollama Server
        run: |
          # Start Ollama service in the background
          OLLAMA_HOST=0.0.0.0:11434 ollama serve &
          sleep 5

      - name: Pull Gemma Model
        run: |
          # Pull Gemma model (use gemma:2b for default runners, or gemma:7b)
          ollama pull gemma:2b

      - name: Expose via Cloudflare Tunnel
        env:
          # Optional: Add your custom Cloudflare Tunnel token in GitHub Secrets as CF_TUNNEL_TOKEN
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if [ -n "$CF_TUNNEL_TOKEN" ]; then
            echo "Starting Cloudflare Tunnel with Custom Domain..."
            cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" &
          else
            echo "Starting Quick Cloudflare Tunnel (Random URL)..."
            cloudflared tunnel --url http://localhost:11434 > tunnel.log 2>&1 &
            
            # Wait for tunnel URL to generate
            sleep 8
            echo "------------------------------------------------------"
            echo "YOUR API CUSTOM URL:"
            grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log || cat tunnel.log
            echo "------------------------------------------------------"
          fi

      - name: Keep Runner Alive
        run: |
          echo "Gemma API is live! Waiting..."
          # Keep step running until timeout
          sleep 21600
