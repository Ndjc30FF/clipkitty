name: Run Gemma API via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama & Cloudflared
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Ollama Server
        run: |
          # Kill any auto-started systemd instances to avoid port conflicts
          sudo systemctl stop ollama || true
          sudo fuser -k 11434/tcp || true
          sleep 2

          # Enable open CORS and bind address
          export OLLAMA_ORIGINS="*"
          export OLLAMA_HOST="0.0.0.0:11434"
          nohup ollama serve > ollama.log 2>&1 &
          sleep 5

      - name: Pull Gemma Model
        run: |
          ollama pull gemma:2b

      - name: Expose via Cloudflare Tunnel
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if [ -n "$CF_TUNNEL_TOKEN" ]; then
            cloudflared tunnel --http-host-header="localhost:11434" run --token "$CF_TUNNEL_TOKEN" &
            TUNNEL_URL="https://your-custom-domain.com"
          else
            cloudflared tunnel --url http://127.0.0.1:11434 --http-host-header="localhost:11434" > tunnel.log 2>&1 &
            sleep 12
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n 1)
          fi

          echo "========================================================"
          echo "OLLAMA BASE URL: ${TUNNEL_URL}"
          echo "========================================================"

          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Base URL for Zed settings.json:
          \`\`\`json
          "api_url": "${TUNNEL_URL}"
          \`\`\`
          EOF

      - name: Keep Runner Alive
        run: |
          echo "Serving requests..."
          sleep 21600
