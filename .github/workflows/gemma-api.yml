name: Run Gemma API via Cloudflare Tunnel

on:
  workflow_dispatch:

jobs:
  run-gemma:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Ollama & Cloudflared
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb

      - name: Start Ollama Server with CORS Enabled
        run: |
          # OLLAMA_ORIGINS="*" is required so apps like Zed can communicate without CORS/403 blocking
          OLLAMA_ORIGINS="*" OLLAMA_HOST=0.0.0.0:11434 ollama serve &
          sleep 5

      - name: Pull Gemma Model
        run: |
          # Note: gemma:2b is recommended for standard GitHub runners due to RAM limits
          ollama pull gemma:2b

      - name: Start Cloudflare Tunnel & Print Connection Config
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
        run: |
          if [ -n "$CF_TUNNEL_TOKEN" ]; then
            echo "Starting Cloudflare Tunnel with Custom Domain..."
            cloudflared tunnel run --token "$CF_TUNNEL_TOKEN" &
            TUNNEL_URL="https://your-custom-domain.com"
          else
            echo "Starting Quick Cloudflare Tunnel..."
            cloudflared tunnel --url http://localhost:11434 > tunnel.log 2>&1 &
            
            # Allow tunnel URL to initialize
            sleep 10
            
            TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' tunnel.log | head -n 1)
          fi

          echo "========================================================"
          echo "MODEL NAME:       gemma:2b"
          echo "PUBLIC BASE URL:  ${TUNNEL_URL}"
          echo "ZED / OPENAI URL: ${TUNNEL_URL}/v1"
          echo "========================================================"

          # Output summary to GitHub Job Summary Page
          cat <<EOF >> $GITHUB_STEP_SUMMARY
          ### 🚀 Gemma API Details for Zed & External Apps

          #### ⚙️ Configuration for Zed Editor
          - **Base URL:** \`${TUNNEL_URL}/v1\`
          - **API format:** \`Chat completions (/chat/completions)\`
          - **API key:** \`ollama\`
          - **Model list:** \`gemma:2b\`

          ---
          #### 📌 cURL Test Command:
          \`\`\`bash
          curl ${TUNNEL_URL}/v1/chat/completions \\
            -H "Content-Type: application/json" \\
            -d '{
              "model": "gemma:2b",
              "messages": [{"role": "user", "content": "Hello Gemma!"}]
            }'
          \`\`\`
          EOF

      - name: Keep Runner Alive
        run: |
          echo "API is active and serving requests..."
          sleep 21600
